
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EssenseHouse</title>
  <meta name="description" content="Построим дом вашей мечты под ключ. Современные технологии, качественные материалы, профессиональный подход." />
  <meta name="author" content="Lovable" />
  <meta property="og:image" content="/og-image.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#B5A88C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cozy Homes">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
  if (history.scrollRestoration) {
    history.scrollRestoration = "manual";
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('ServiceWorker registration successful');
              })
              .catch((err) => {
                console.log('ServiceWorker registration failed: ', err);
              });
    });
  }
</script>
</body>
</html>
